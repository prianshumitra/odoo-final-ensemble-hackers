services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: odoo_backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://admin-odoo:odoo123@cluster0.sp8itln.mongodb.net/diligent_wombat?appName=Cluster0}
      - JWT_SECRET=${JWT_SECRET:-diligent_wombat_super_secret_jwt_key_2026}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: odoo_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY:-pk_test_cmVsaWV2ZWQtbWFydGVuLTUxLmNsZXJrLmFjY291bnRzLmRldiQ}
    depends_on:
      - backend
    restart: unless-stopped
